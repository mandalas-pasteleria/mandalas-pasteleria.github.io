<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Mandalas Cosas Ricas</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fondoOscuro: '#161412', fondoMedio: '#4a4138', fondoTarjeta: '#221f1d',
            cobre: '#b87352', cobreOscuro: '#945a3f', textoClaro: '#f4ece2', textoGris: '#a89f94'
          },
          fontFamily: {
            titulo: ['"Playfair Display"', 'serif'],
            texto: ['"Montserrat"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .menu-activo { color: #b87352 !important; border-bottom: 2px solid #b87352; padding-bottom: 2px; }
  </style>
</head>

<body class="bg-fondoMedio text-textoClaro font-texto min-h-screen flex flex-col antialiased">

  <!-- PANTALLA DE LOGIN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center bg-fondoOscuro p-4 z-50">
    <div class="bg-fondoTarjeta p-8 rounded-md shadow-2xl border border-gray-700 w-full max-w-sm text-center">
      <h2 class="font-titulo text-3xl text-cobre mb-6">Mandalas Admin</h2>
      <form id="form-login" class="flex flex-col gap-4">
        <input type="email" id="login-email" placeholder="Correo electrónico" required class="w-full bg-fondoOscuro border border-gray-700 text-textoClaro p-3 rounded focus:border-cobre outline-none transition text-sm">
        <input type="password" id="login-password" placeholder="Contraseña" required class="w-full bg-fondoOscuro border border-gray-700 text-textoClaro p-3 rounded focus:border-cobre outline-none transition text-sm">
        <button type="submit" id="btn-login" class="bg-cobre hover:bg-cobreOscuro text-white font-bold py-3 rounded transition uppercase tracking-widest text-sm mt-2">
          Ingresar
        </button>
        <p id="login-error" class="text-red-500 text-xs hidden mt-2">Credenciales incorrectas.</p>
      </form>
    </div>
  </div>

  <!-- PANTALLA PRINCIPAL -->
  <div id="admin-screen" class="hidden flex-col min-h-screen">
    
    <nav class="bg-fondoOscuro py-4 px-6 md:px-12 flex flex-wrap justify-between items-center border-b border-gray-800 shadow-xl sticky top-0 z-40 gap-4">
      <div class="font-titulo text-xl font-bold text-textoClaro">
        Panel de Control <span class="text-cobre italic font-normal text-sm">Mandalas</span>
      </div>
      
      <div class="flex flex-wrap gap-2 md:gap-3">
        <button onclick="descargarRespaldoFotos()" class="bg-blue-900 hover:bg-blue-800 text-white text-[10px] sm:text-xs font-bold py-2 px-3 rounded transition shadow flex items-center gap-2 uppercase tracking-wider border border-blue-700">
          <i class="fa-solid fa-list-check"></i> <span class="hidden sm:inline">Guía Fotos</span>
        </button>

        <button onclick="abrirModalAnuncio()" class="bg-indigo-900 hover:bg-indigo-800 text-white text-[10px] sm:text-xs font-bold py-2 px-3 rounded transition shadow flex items-center gap-2 uppercase tracking-wider border border-indigo-700">
          <i class="fa-solid fa-bullhorn"></i> <span class="hidden sm:inline">Anuncio</span>
        </button>

        <button onclick="descargarRespaldo()" class="bg-gray-800 hover:bg-gray-700 text-white text-[10px] sm:text-xs font-bold py-2 px-3 rounded transition shadow flex items-center gap-2 uppercase tracking-wider border border-gray-600">
          <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Respaldo BD</span>
        </button>

        <button onclick="abrirModalCategorias()" class="bg-gray-700 hover:bg-gray-600 text-white text-[10px] sm:text-xs font-bold py-2 px-3 rounded transition shadow flex items-center gap-2 uppercase tracking-wider">
          <i class="fa-solid fa-tags"></i> <span class="hidden sm:inline">Categorías</span>
        </button>
        <button onclick="abrirModalNuevo()" class="bg-cobre hover:bg-cobreOscuro text-white text-[10px] sm:text-xs font-bold py-2 px-3 rounded transition shadow flex items-center gap-2 uppercase tracking-wider">
          <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Nuevo</span>
        </button>
        <button onclick="cerrarSesion()" class="bg-red-900 hover:bg-red-800 text-white text-[10px] sm:text-xs font-bold py-2 px-3 rounded transition shadow flex items-center gap-2 uppercase tracking-wider ml-2">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </nav>

    <main class="py-10 px-6 md:px-12 max-w-7xl mx-auto w-full">
      <div class="flex justify-center mb-10">
        <div class="bg-fondoTarjeta border border-gray-700 px-8 py-5 rounded-md shadow-xl flex items-center gap-5">
          <div class="bg-cobre/20 text-cobre p-4 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-eye text-2xl"></i>
          </div>
          <div>
            <p class="text-textoGris text-xs uppercase tracking-widest font-bold mb-1">Visitas a la página</p>
            <div class="flex items-center gap-3">
              <p id="contador-visitas" class="text-4xl font-titulo text-textoClaro">...</p>
              <button onclick="reiniciarVisitas()" class="text-gray-500 hover:text-cobre transition text-sm ml-2 mt-2" title="Reiniciar a cero">
                <i class="fa-solid fa-rotate-left"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="menu-categorias" class="flex flex-wrap justify-center gap-4 md:gap-8 mb-12"></div>
      <h2 id="titulo-categoria" class="font-titulo text-3xl text-textoClaro capitalize mb-6 text-center">Todo</h2>
      <div id="grilla-admin" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>
  </div>

  <!-- Modal Nuevo/Editar Producto -->
  <div id="modal-form" class="fixed inset-0 bg-black bg-opacity-90 hidden flex items-center justify-center p-4 z-50 transition-opacity overflow-y-auto py-10">
    <div class="bg-fondoTarjeta rounded-md max-w-lg w-full p-8 border border-gray-700 shadow-2xl relative my-auto">
      <button onclick="cerrarModal()" class="absolute top-4 right-4 text-textoGris hover:text-textoClaro transition"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 id="modal-titulo" class="font-titulo text-2xl text-cobre mb-6 border-b border-gray-700 pb-2">Agregar Producto</h3>
      
      <form id="form-producto" class="flex flex-col gap-4">
        <input type="hidden" id="prod-id">
        <div>
          <label class="block text-xs font-semibold text-textoGris uppercase tracking-wider mb-1">Nombre</label>
          <input type="text" id="nombre" required class="w-full bg-fondoOscuro border border-gray-700 text-textoClaro p-2 rounded focus:border-cobre outline-none transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-textoGris uppercase tracking-wider mb-1">Categoría</label>
          <select id="categoria-select" class="w-full bg-fondoOscuro border border-gray-700 text-textoClaro p-2 rounded focus:border-cobre outline-none transition"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-textoGris uppercase tracking-wider mb-1">Descripción</label>
          <textarea id="descripcion" required class="w-full bg-fondoOscuro border border-gray-700 text-textoClaro p-2 rounded focus:border-cobre outline-none transition" rows="3"></textarea>
        </div>

        <div class="bg-fondoOscuro p-4 rounded border border-gray-700">
          <label class="block text-sm font-bold text-cobre uppercase tracking-wider mb-2"><i class="fa-solid fa-image"></i> Foto de Portada</label>
          <input type="file" id="imagen-file" accept="image/*" class="w-full text-sm text-textoGris file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-cobre file:text-white hover:file:bg-cobreOscuro transition">
          <div id="preview-portada" class="mt-3 hidden">
            <p class="text-[10px] text-textoGris mb-1 uppercase tracking-wider">Portada Actual:</p>
            <div class="w-24 h-24 rounded-md overflow-hidden border-2 border-gray-600 shadow-md">
              <img id="img-portada-actual" src="" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/600x800/161412/b87352?text=Error'">
            </div>
          </div>
        </div>

        <div class="bg-fondoOscuro p-4 rounded border border-gray-700">
          <label class="block text-sm font-bold text-cobre uppercase tracking-wider mb-1"><i class="fa-solid fa-images"></i> Fotos Extra (Galería)</label>
          <input type="file" id="galeria-files" accept="image/*" multiple class="w-full text-sm text-textoGris file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-gray-700 file:text-white hover:file:bg-gray-600 transition mb-4">
          <div id="galeria-actual-container" class="flex gap-4 flex-wrap"></div>
        </div>

        <button type="submit" id="btn-guardar" class="bg-cobre hover:bg-cobreOscuro text-white font-bold py-3 rounded mt-2 transition uppercase tracking-widest text-sm shadow-lg">Guardar Cambios</button>
      </form>
    </div>
  </div>

  <!-- Modal Gestor de Categorías -->
  <div id="modal-categorias" class="fixed inset-0 bg-black bg-opacity-90 hidden flex items-center justify-center p-4 z-50 transition-opacity">
    <div class="bg-fondoTarjeta rounded-md max-w-md w-full p-8 border border-gray-700 shadow-2xl relative">
      <button onclick="cerrarModalCategorias()" class="absolute top-4 right-4 text-textoGris hover:text-textoClaro transition"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="font-titulo text-2xl text-cobre mb-4 border-b border-gray-700 pb-2">Gestionar Categorías</h3>
      <form id="form-nueva-cat" class="flex gap-2 mb-6">
        <input type="text" id="nueva-cat-nombre" placeholder="Ej: Alfajores" required class="flex-1 bg-fondoOscuro border border-gray-700 text-textoClaro p-2 rounded focus:border-cobre outline-none transition">
        <button type="submit" class="bg-cobre hover:bg-cobreOscuro text-white px-4 rounded transition"><i class="fa-solid fa-plus"></i></button>
      </form>
      <div class="max-h-64 overflow-y-auto pr-2">
        <ul id="lista-gestion-categorias" class="flex flex-col gap-3"></ul>
      </div>
    </div>
  </div>

  <!-- Modal Anuncios -->
  <div id="modal-anuncio" class="fixed inset-0 bg-black bg-opacity-90 hidden flex items-center justify-center p-4 z-50 transition-opacity overflow-y-auto">
    <div class="bg-fondoTarjeta rounded-md max-w-lg w-full p-8 border border-indigo-900 shadow-2xl relative">
      <button onclick="cerrarModalAnuncio()" class="absolute top-4 right-4 text-textoGris hover:text-textoClaro transition"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="font-titulo text-2xl text-indigo-400 mb-6 border-b border-gray-700 pb-2"><i class="fa-solid fa-bullhorn"></i> Gestionar Anuncio</h3>
      
      <form id="form-anuncio" class="flex flex-col gap-4">
        
        <label class="flex items-center gap-3 bg-fondoOscuro p-4 rounded border border-gray-700 cursor-pointer hover:border-indigo-500 transition">
          <input type="checkbox" id="anuncio-activo" class="w-5 h-5 accent-indigo-500">
          <span class="text-sm font-bold text-textoClaro">Activar este anuncio en la página</span>
        </label>

        <div>
          <label class="block text-xs font-semibold text-textoGris uppercase tracking-wider mb-1">Título del Anuncio</label>
          <input type="text" id="anuncio-titulo" placeholder="Ej: ¡Feria de Tortas!" class="w-full bg-fondoOscuro border border-gray-700 text-textoClaro p-2 rounded focus:border-indigo-500 outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-textoGris uppercase tracking-wider mb-1">Cuerpo del mensaje</label>
          <textarea id="anuncio-texto" rows="4" placeholder="Detalles de la novedad..." class="w-full bg-fondoOscuro border border-gray-700 text-textoClaro p-2 rounded focus:border-indigo-500 outline-none transition"></textarea>
        </div>

        <div class="bg-fondoOscuro p-4 rounded border border-gray-700">
          <label class="block text-sm font-bold text-indigo-400 uppercase tracking-wider mb-2"><i class="fa-solid fa-image"></i> Imagen de Fondo (Textura)</label>
          <input type="file" id="anuncio-imagen" accept="image/*" class="w-full text-sm text-textoGris file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-900 file:text-white hover:file:bg-indigo-800 transition">
          <div id="preview-anuncio-bg" class="mt-3 hidden">
            <p class="text-[10px] text-textoGris mb-1 uppercase tracking-wider">Fondo Actual:</p>
            <div class="w-full h-24 rounded-md overflow-hidden border border-gray-600 relative">
              <img id="img-anuncio-actual" src="" class="w-full h-full object-cover opacity-50">
            </div>
          </div>
        </div>

        <button type="submit" id="btn-guardar-anuncio" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded mt-2 transition uppercase tracking-widest text-sm shadow-lg">Publicar Anuncio</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, deleteDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBw3U23D7b8nPhZa4z5sSNkqHPx1jVdIIg",
      authDomain: "mandalas-bd.firebaseapp.com",
      projectId: "mandalas-bd",
      storageBucket: "mandalas-bd.firebasestorage.app",
      messagingSenderId: "401668436120",
      appId: "1:401668436120:web:16b4cec5606b6e846ee0ed"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app); 

    let productos = [];
    let categorias = [];
    let urlImagenActual = ""; 
    let galeriaActual = []; 
    let urlAnuncioActual = "";

    // --- SISTEMA DE LOGIN ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.remove('hidden');
        document.getElementById('admin-screen').classList.add('flex');
        iniciarAppAdmin();
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('admin-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.remove('flex');
      }
    });

    document.getElementById('form-login').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');
      btn.innerText = "Verificando...";
      
      signInWithEmailAndPassword(auth, email, pass)
        .then(() => { document.getElementById('login-error').classList.add('hidden'); })
        .catch((error) => {
          document.getElementById('login-error').classList.remove('hidden');
          btn.innerText = "Ingresar";
        });
    });

    window.cerrarSesion = function() { signOut(auth).then(() => { window.location.reload(); }); }

    function iniciarAppAdmin() {
      cargarVisitas();
      inicializarCategorias().then(() => cargarProductos());
    }

    async function cargarVisitas() {
      try {
        const docSnap = await getDoc(doc(db, "estadisticas", "visitas"));
        if (docSnap.exists()) { document.getElementById("contador-visitas").innerText = docSnap.data().total; } 
      } catch (error) { console.log(error); }
    }

    window.reiniciarVisitas = async function() {
      if(confirm("¿Estás seguro que querés volver el contador a CERO?")) {
        await updateDoc(doc(db, "estadisticas", "visitas"), { total: 0 });
        document.getElementById("contador-visitas").innerText = "0";
      }
    }

    async function inicializarCategorias() {
      const snap = await getDocs(collection(db, "categorias"));
      if (snap.empty) {
        const catsAntiguas = ["tortas", "budines", "materas", "postres", "tartas", "navidad", "pascuas", "mesas dulces"];
        for (let cat of catsAntiguas) { await addDoc(collection(db, "categorias"), { nombre: cat, oculta: false }); }
      }
      await refrescarCategorias();
    }

    async function refrescarCategorias() {
      const snap = await getDocs(collection(db, "categorias"));
      categorias = [];
      snap.forEach(doc => { categorias.push({ id: doc.id, ...doc.data() }); });
      categorias.sort((a, b) => a.nombre.localeCompare(b.nombre)); 
      renderizarUI();
    }

    function renderizarUI() {
      const menu = document.getElementById("menu-categorias");
      const selectCat = document.getElementById("categoria-select");
      const listaGestion = document.getElementById("lista-gestion-categorias");
      
      menu.innerHTML = `<button onclick="filtrarAdmin('todos')" class="menu-btn menu-activo text-textoClaro hover:text-cobre transition text-xs font-semibold tracking-widest uppercase">Todo</button>`;
      selectCat.innerHTML = "";
      listaGestion.innerHTML = "";
      
      categorias.forEach(cat => {
        const iconoOculto = cat.oculta ? ' <i class="fa-solid fa-eye-slash text-gray-500"></i>' : '';
        menu.innerHTML += `<button onclick="filtrarAdmin('${cat.nombre}')" class="menu-btn text-textoClaro hover:text-cobre transition text-xs font-semibold tracking-widest uppercase flex items-center gap-1">${cat.nombre}${iconoOculto}</button>`;
        selectCat.innerHTML += `<option value="${cat.nombre}">${cat.nombre}</option>`;

        const colorBtnOjo = cat.oculta ? 'text-gray-600 hover:text-gray-400' : 'text-green-500 hover:text-green-400';
        const iconOjo = cat.oculta ? 'fa-eye-slash' : 'fa-eye';
        listaGestion.innerHTML += `
          <li class="flex justify-between items-center bg-fondoOscuro p-3 rounded border border-gray-700">
            <span class="${cat.oculta ? 'text-gray-500 line-through' : 'text-textoClaro'}">${cat.nombre}</span>
            <div class="flex gap-4">
              <button onclick="toggleCategoria('${cat.id}', ${cat.oculta})" class="${colorBtnOjo} transition"><i class="fa-solid ${iconOjo}"></i></button>
              <button onclick="borrarCategoria('${cat.id}')" class="text-red-900 hover:text-red-700 transition"><i class="fa-solid fa-trash"></i></button>
            </div>
          </li>
        `;
      });
    }

    window.abrirModalCategorias = function() { document.getElementById("modal-categorias").classList.remove("hidden"); }
    window.cerrarModalCategorias = function() { document.getElementById("modal-categorias").classList.add("hidden"); }
    
    document.getElementById('form-nueva-cat').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nueva-cat-nombre').value.trim();
      await addDoc(collection(db, "categorias"), { nombre: nombre, oculta: false });
      document.getElementById('nueva-cat-nombre').value = "";
      refrescarCategorias();
    });

    window.toggleCategoria = async function(id, estadoActual) {
      await updateDoc(doc(db, "categorias", id), { oculta: !estadoActual });
      refrescarCategorias();
    }

    window.borrarCategoria = async function(id) {
      if(confirm("¿Borrar categoría?")) { await deleteDoc(doc(db, "categorias", id)); refrescarCategorias(); }
    }

    async function cargarProductos() {
      const querySnapshot = await getDocs(collection(db, "productos"));
      productos = [];
      querySnapshot.forEach((doc) => { productos.push({ id: doc.id, ...doc.data() }); });
      filtrarAdmin('todos');
    }

    window.filtrarAdmin = function(cat) {
      const botones = document.querySelectorAll(".menu-btn");
      botones.forEach(btn => {
        btn.classList.remove("menu-activo");
        const textoBoton = btn.innerText.replace(" ", "").toLowerCase();
        if (cat === "todos" && textoBoton.includes("todo")) btn.classList.add("menu-activo");
        else if (textoBoton.includes(cat.replace(" ", "").toLowerCase())) btn.classList.add("menu-activo");
      });
      document.getElementById("titulo-categoria").innerText = cat === "todos" ? "Todos los productos" : cat;

      const filtrados = cat === "todos" ? productos : productos.filter(p => p.categoria.toLowerCase() === cat.toLowerCase());
      const grilla = document.getElementById("grilla-admin");
      grilla.innerHTML = "";

      filtrados.forEach(prod => {
        const badgeGaleria = (prod.galeria && prod.galeria.length > 0) ? `<div class="absolute top-2 right-2 bg-black/80 text-white text-[10px] px-2 py-1 rounded-full shadow"><i class="fa-solid fa-images"></i> +${prod.galeria.length}</div>` : '';
        grilla.innerHTML += `
          <div class="bg-fondoTarjeta p-4 rounded border border-gray-700 flex flex-col shadow-lg">
            <div class="w-full aspect-[3/4] overflow-hidden mb-3 bg-fondoOscuro rounded relative">
             <img src="${prod.imagen}" class="w-full h-full object-cover opacity-90" onerror="this.style.display='none'">
              ${badgeGaleria}
            </div>
            <p class="text-cobre text-[10px] uppercase font-bold tracking-widest">${prod.categoria}</p>
            <h3 class="font-titulo text-lg text-textoClaro mb-2 leading-tight">${prod.nombre}</h3>
            <div class="mt-auto flex gap-2 border-t border-gray-700 pt-3">
              <button onclick="editarProducto('${prod.id}')" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white text-xs py-2 rounded transition"><i class="fa-solid fa-pen"></i> Editar</button>
              <button onclick="borrarProducto('${prod.id}')" class="flex-1 bg-red-900 hover:bg-red-800 text-white text-xs py-2 rounded transition"><i class="fa-solid fa-trash"></i> Borrar</button>
            </div>
          </div>
        `;
      });
    }

    window.descargarRespaldo = function() {
      if (productos.length === 0) return alert("No hay productos.");
      const datos = JSON.stringify(productos, null, 2);
      const archivo = new Blob([datos], { type: 'application/json' });
      const url = URL.createObjectURL(archivo);
      const enlace = document.createElement('a'); enlace.href = url;
      enlace.download = `mandalas_respaldo_${new Date().toLocaleDateString().replaceAll('/', '-')}.json`;
      enlace.click(); URL.revokeObjectURL(url);
    }

    // --- EXTRAER GUÍA DE FOTOS (TXT) ---
    window.descargarRespaldoFotos = function() {
      if (productos.length === 0) return alert("No hay productos cargados.");
      
      let texto = "📋 GUÍA DE FOTOS PARA RESUBIR - MANDALAS COSAS RICAS\n";
      texto += "====================================================\n\n";

      productos.forEach(prod => {
        texto += `🎂 PRODUCTO: ${prod.nombre.toUpperCase()} (${prod.categoria})\n`;
        if (prod.imagen) { texto += `   - Link Portada vieja: ${prod.imagen}\n`; } else { texto += `   - Portada: (Sin foto cargada)\n`; }
        if (prod.galeria && prod.galeria.length > 0) {
          prod.galeria.forEach((img, i) => { texto += `   - Link Galería ${i+1} vieja: ${img}\n`; });
        }
        texto += `--------------------------------------------------\n`;
      });

      const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a'); enlace.href = url;
      enlace.download = `Guia_Resubir_Fotos_Mandalas.txt`;
      enlace.click(); URL.revokeObjectURL(url);
    }

    // --- PROCESADOR DE IMÁGENES (600x800, JPG) ---
    const comprimirImagen = (archivo) => {
      return new Promise((resolve) => {
        const reader = new FileReader(); 
        reader.readAsDataURL(archivo);
        reader.onload = (event) => {
          const img = new Image(); 
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const anchoObjetivo = 600;
            const altoObjetivo = 800;
            canvas.width = anchoObjetivo;
            canvas.height = altoObjetivo;

            const ratioObjetivo = anchoObjetivo / altoObjetivo;
            const ratioImagen = img.width / img.height;
            let sx, sy, sWidth, sHeight;

            if (ratioImagen > ratioObjetivo) {
              sHeight = img.height;
              sWidth = sHeight * ratioObjetivo;
              sx = (img.width - sWidth) / 2;
              sy = 0;
            } else {
              sWidth = img.width;
              sHeight = sWidth / ratioObjetivo;
              sx = 0;
              sy = (img.height - sHeight) / 2;
            }

            ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, anchoObjetivo, altoObjetivo);

            // COMPRESIÓN DE ALTA VELOCIDAD A WEBP (Cloudinary compatible)
            canvas.toBlob((blob) => { 
              const nuevoNombre = archivo.name.replace(/\.[^/.]+$/, "") + ".webp";
              resolve(new File([blob], nuevoNombre, { type: 'image/webp' })); 
            }, 'image/webp', 0.90);
          };
        };
      });
    };

    // --- NUEVO MOTOR: SUBIDA A CLOUDINARY ---
    async function subirACloudinary(archivo) {
      const formData = new FormData();
      formData.append('file', archivo);
      formData.append('upload_preset', 'mandalas-cosas-ricas');

      const response = await fetch('https://api.cloudinary.com/v1_1/difaxp0o/image/upload', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();
      if (data.secure_url) {
        return data.secure_url;
      } else {
        throw new Error('Cloudinary rechazó la imagen. Revisá la configuración del preset.');
      }
    }

    window.abrirModalNuevo = function() {
      document.getElementById('form-producto').reset();
      document.getElementById('imagen-file').value = ""; document.getElementById('galeria-files').value = "";
      document.getElementById('prod-id').value = "";
      document.getElementById('modal-titulo').innerText = "Nuevo Producto";
      document.getElementById('preview-portada').classList.add('hidden');
      document.getElementById("modal-form").classList.remove("hidden");
      document.getElementById('imagen-file').required = true;
      galeriaActual = []; renderizarGaleriaActual();
    }

    window.editarProducto = function(id) {
      const prod = productos.find(p => p.id === id);
      document.getElementById('prod-id').value = prod.id;
      document.getElementById('nombre').value = prod.nombre;
      document.getElementById('categoria-select').value = prod.categoria;
      document.getElementById('descripcion').value = prod.descripcion;
      urlImagenActual = prod.imagen; 
      document.getElementById('imagen-file').value = ""; document.getElementById('galeria-files').value = "";
      document.getElementById('preview-portada').classList.remove('hidden');
      document.getElementById('img-portada-actual').src = prod.imagen;
      galeriaActual = prod.galeria || []; renderizarGaleriaActual();
      document.getElementById('modal-titulo').innerText = "Editar Producto";
      document.getElementById('imagen-file').required = false; 
      document.getElementById("modal-form").classList.remove("hidden");
    }

    window.renderizarGaleriaActual = function() {
      const container = document.getElementById('galeria-actual-container');
      container.innerHTML = "";
      if (galeriaActual.length > 0) {
        galeriaActual.forEach((url, index) => {
          container.innerHTML += `
            <div class="relative w-24 h-24 rounded-md overflow-hidden border-2 border-gray-600 shadow-md">
              <img src="${url}" class="w-full h-full object-cover">
              <button type="button" onclick="eliminarFotoGaleria(${index})" class="absolute top-1 right-1 bg-red-600 hover:bg-red-800 text-white rounded-full w-7 h-7 flex items-center justify-center transition"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>
          `;
        });
      }
    }

    window.eliminarFotoGaleria = function(index) { galeriaActual.splice(index, 1); renderizarGaleriaActual(); }
    window.cerrarModal = function() { document.getElementById("modal-form").classList.add("hidden"); }
    window.borrarProducto = async function(id) {
      if(confirm("¿Borrar producto?")) { await deleteDoc(doc(db, "productos", id)); cargarProductos(); }
    }

    // --- GUARDAR PRODUCTO EN FIREBASE Y FOTOS EN CLOUDINARY ---
    document.getElementById('form-producto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const boton = document.getElementById('btn-guardar'); 
      const originalText = boton.innerHTML; 
      boton.disabled = true;
      
      try {
        const id = document.getElementById('prod-id').value;
        const archivoFoto = document.getElementById('imagen-file').files[0];
        const archivosGaleria = document.getElementById('galeria-files').files;
        let urlFinal = urlImagenActual; 

        if (archivoFoto) {
          boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Subiendo portada...';
          const fotoComprimida = await comprimirImagen(archivoFoto); 
          urlFinal = await subirACloudinary(fotoComprimida);
        }

        let nuevasUrlsGaleria = [];
        if (archivosGaleria.length > 0) {
          for (let i = 0; i < archivosGaleria.length; i++) {
            boton.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Galería (${i+1}/${archivosGaleria.length})...`;
            const fotoCom = await comprimirImagen(archivosGaleria[i]); 
            const urlGaleria = await subirACloudinary(fotoCom);
            nuevasUrlsGaleria.push(urlGaleria);
          }
        }
        
        const galeriaFinal = [...galeriaActual, ...nuevasUrlsGaleria];
        const datosProducto = { 
          nombre: document.getElementById('nombre').value, 
          categoria: document.getElementById('categoria-select').value, 
          descripcion: document.getElementById('descripcion').value, 
          imagen: urlFinal, 
          galeria: galeriaFinal 
        };

        boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando datos...';
        if (id) { 
          await updateDoc(doc(db, "productos", id), datosProducto); 
        } else { 
          await addDoc(collection(db, "productos"), datosProducto); 
        }
        
        cerrarModal(); 
        cargarProductos(); 
      } catch (error) { 
        alert("Error: " + error.message); 
      } finally { 
        boton.innerHTML = originalText; 
        boton.disabled = false; 
      }
    });

    // --- LÓGICA DE ANUNCIOS CON CLOUDINARY ---
    window.abrirModalAnuncio = async function() {
      document.getElementById("modal-anuncio").classList.remove("hidden");
      try {
        const docSnap = await getDoc(doc(db, "configuracion", "anuncio"));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('anuncio-activo').checked = data.activo || false;
          document.getElementById('anuncio-titulo').value = data.titulo || "";
          document.getElementById('anuncio-texto').value = data.texto || "";
          urlAnuncioActual = data.imagen || "";
          
          if(urlAnuncioActual) {
            document.getElementById('preview-anuncio-bg').classList.remove('hidden');
            document.getElementById('img-anuncio-actual').src = urlAnuncioActual;
          } else {
            document.getElementById('preview-anuncio-bg').classList.add('hidden');
          }
        }
      } catch(e) { console.log("Anuncio nuevo"); }
    }

    window.cerrarModalAnuncio = function() { document.getElementById("modal-anuncio").classList.add("hidden"); }

    document.getElementById('form-anuncio').addEventListener('submit', async (e) => {
      e.preventDefault();
      const boton = document.getElementById('btn-guardar-anuncio');
      const originalText = boton.innerHTML;
      boton.disabled = true;

      try {
        const archivoFoto = document.getElementById('anuncio-imagen').files[0];
        let urlFinal = urlAnuncioActual; 

        if (archivoFoto) {
          boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Subiendo fondo...';
          const fotoComprimida = await comprimirImagen(archivoFoto); 
          urlFinal = await subirACloudinary(fotoComprimida);
        }

        const datosAnuncio = {
          activo: document.getElementById('anuncio-activo').checked,
          titulo: document.getElementById('anuncio-titulo').value,
          texto: document.getElementById('anuncio-texto').value,
          imagen: urlFinal
        };

        boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
        await setDoc(doc(db, "configuracion", "anuncio"), datosAnuncio);
        cerrarModalAnuncio();
        alert("Anuncio actualizado con éxito.");
      } catch (error) { 
        alert("Error al guardar anuncio"); 
      } finally { 
        boton.innerHTML = originalText; 
        boton.disabled = false; 
      }
    });
  </script>
</body>
</html>
