<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandalas Cosas Ricas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fondoOscuro: '#161412', fondoMedio: '#4a4138', fondoTarjeta: '#221f1d',
            cobre: '#b87352', cobreOscuro: '#945a3f', textoClaro: '#f4ece2', textoGris: '#a89f94'
          },
          fontFamily: {
            titulo: ['"Playfair Display"', 'serif'],
            texto: ['"Montserrat"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .menu-activo { color: #b87352 !important; border-bottom: 2px solid #b87352; padding-bottom: 2px; }
    .fade-in-up { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
    .fade-in-up.visible { opacity: 1; transform: translateY(0); }
    .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-fondoMedio text-textoClaro font-texto min-h-screen flex flex-col antialiased">

  <header class="bg-fondoOscuro py-12 px-6 text-center border-b border-gray-800 shadow-2xl flex flex-col items-center">
    
    <!-- Imagen de inicio recuperada -->
    <img src="97569.png" alt="Mandalas Logo" class="w-32 h-32 md:w-48 md:h-48 object-contain mb-6 drop-shadow-2xl hover:scale-105 transition-transform duration-300">
    
    <h1 class="font-titulo text-4xl md:text-6xl font-bold text-textoClaro tracking-wide mb-3">Mandalas <span class="text-cobre italic font-normal text-3xl md:text-5xl">Cosas Ricas</span></h1>
    <p class="text-textoGris max-w-xl mx-auto text-sm leading-relaxed">Elaboración artesanal con dedicación y los mejores ingredientes.</p>
  </header>

  <main class="py-12 px-6 md:px-12 max-w-7xl mx-auto w-full flex-grow">
    <!-- Menú de categorías dinámico -->
    <div id="menu-categorias" class="flex flex-wrap justify-center gap-4 md:gap-8 mb-16 border-b border-gray-800 pb-4">
      <!-- Se llena desde JS -->
    </div>

    <!-- Grilla de productos -->
    <div id="grilla-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
      <p class="text-center w-full col-span-full py-10 text-textoGris"><i class="fa-solid fa-spinner fa-spin text-cobre text-2xl mb-2"></i><br>Cargando delicias...</p>
    </div>
  </main>

  <!-- Modal Rediseñado (Foto Vertical + Texto Abajo) -->
  <div id="modal-producto" class="fixed inset-0 bg-black bg-opacity-95 hidden flex-col items-center justify-center p-4 z-50 transition-opacity">
    <!-- Se llena desde JS -->
  </div>

  <footer class="bg-fondoOscuro py-8 text-center border-t border-gray-800 mt-auto">
    <p class="text-textoGris text-xs uppercase tracking-widest">&copy; 2024 Mandalas Cosas Ricas. Todos los derechos reservados.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBw3U23D7b8nPhZa4z5sSNkqHPx1jVdIIg",
      authDomain: "mandalas-bd.firebaseapp.com",
      projectId: "mandalas-bd",
      storageBucket: "mandalas-bd.firebasestorage.app",
      messagingSenderId: "401668436120",
      appId: "1:401668436120:web:16b4cec5606b6e846ee0ed"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productos = [];
    let categorias = [];

    // --- CONTADOR DE VISITAS INVISIBLE ---
    async function registrarVisita() {
      if (!sessionStorage.getItem("visitaContada")) {
        try {
          await setDoc(doc(db, "estadisticas", "visitas"), { total: increment(1) }, { merge: true });
          sessionStorage.setItem("visitaContada", "true");
        } catch (error) { console.log("Error al contar visita"); }
      }
    }
    registrarVisita();

    // Observador para la animación al hacer scroll
    const observador = new IntersectionObserver((entradas) => {
      entradas.forEach(entrada => {
        if (entrada.isIntersecting) { entrada.target.classList.add('visible'); }
      });
    });

    async function cargarDatos() {
      // 1. Cargar Categorías
      const catSnap = await getDocs(collection(db, "categorias"));
      catSnap.forEach((doc) => { categorias.push({ id: doc.id, ...doc.data() }); });
      
      // 2. Cargar Productos
      const prodSnap = await getDocs(collection(db, "productos"));
      prodSnap.forEach((doc) => { productos.push({ id: doc.id, ...doc.data() }); });
      
      renderizarMenu();
      filtrar('todos');
    }

    function renderizarMenu() {
      const menu = document.getElementById("menu-categorias");
      menu.innerHTML = `<button onclick="filtrar('todos')" class="menu-btn menu-activo text-textoGris hover:text-cobre transition text-xs font-semibold tracking-widest uppercase">Todo</button>`;
      
      // Filtramos para mostrar SOLO las categorías que NO están ocultas
      const categoriasVisibles = categorias.filter(cat => !cat.oculta);
      
      categoriasVisibles.forEach(cat => {
        menu.innerHTML += `<button onclick="filtrar('${cat.nombre}')" class="menu-btn text-textoGris hover:text-cobre transition text-xs font-semibold tracking-widest uppercase">${cat.nombre}</button>`;
      });
    }

    window.filtrar = function(catNombre) {
      const botones = document.querySelectorAll(".menu-btn");
      botones.forEach(btn => {
        btn.classList.remove("menu-activo");
        const textoBoton = btn.innerText.toLowerCase();
        if (catNombre === "todos" && textoBoton === "todo") btn.classList.add("menu-activo");
        else if (textoBoton === catNombre.toLowerCase()) btn.classList.add("menu-activo");
      });

      const filtrados = catNombre === "todos" ? productos : productos.filter(p => p.categoria.toLowerCase() === catNombre.toLowerCase());
      renderizarProductos(filtrados);
    }

    function renderizarProductos(items) {
      const grilla = document.getElementById("grilla-productos");
      grilla.innerHTML = "";

      if (items.length === 0) {
        grilla.innerHTML = `<p class="text-textoGris text-center col-span-full py-10">No se encontraron delicias en esta categoría.</p>`;
        return;
      }

      items.forEach(prod => {
        const tarjeta = document.createElement('div');
        tarjeta.className = "fade-in-up bg-fondoTarjeta p-5 rounded-sm shadow-xl hover:-translate-y-2 transition transform duration-300 cursor-pointer group flex flex-col items-center border border-gray-800";
        tarjeta.onclick = () => window.abrirModal(prod.id);
        
        tarjeta.innerHTML = `
          <div class="w-full aspect-[3/4] overflow-hidden rounded-sm mb-6 bg-fondoOscuro flex items-center justify-center">
            <img src="${prod.imagen}" loading="lazy" alt="${prod.nombre}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-110 transition duration-500">
          </div>
          <h3 class="font-titulo font-bold text-center text-textoClaro text-xl mb-2 leading-tight group-hover:text-cobre transition">${prod.nombre}</h3>
          <div class="h-[1px] w-12 bg-cobre opacity-50 mt-2 mb-4"></div>
          <p class="text-textoGris text-xs uppercase tracking-widest">Ver Detalles</p>
        `;
        
        grilla.appendChild(tarjeta);
        observador.observe(tarjeta);
      });
    }

    window.abrirModal = function(id) {
      const prod = productos.find(p => p.id === id);
      if (!prod) return;

      const modal = document.getElementById("modal-producto");
      modal.classList.remove("hidden");
      modal.classList.add("flex");

      modal.innerHTML = `
        <div class="bg-fondoTarjeta w-full max-w-md mx-auto rounded-md overflow-hidden shadow-2xl relative flex flex-col max-h-[90vh] animate-fade-in-up border border-gray-700">
          <button onclick="cerrarModal()" class="absolute top-3 right-3 bg-black/60 hover:bg-black/90 text-white rounded-full w-8 h-8 flex items-center justify-center z-10 transition border border-gray-600">
            <i class="fa-solid fa-xmark"></i>
          </button>

          <div class="w-full aspect-[3/4] max-h-[45vh] overflow-hidden bg-fondoOscuro relative">
            <img src="${prod.imagen}" class="w-full h-full object-cover object-center" alt="${prod.nombre}">
          </div>

          <div class="p-6 flex flex-col items-center text-center overflow-y-auto">
            <p class="text-cobre text-[10px] uppercase font-bold tracking-widest mb-1">${prod.categoria}</p>
            <h3 class="font-titulo text-3xl text-textoClaro mb-3">${prod.nombre}</h3>
            <p class="text-textoGris text-sm mb-6 leading-relaxed">${prod.descripcion}</p>
            <a href="https://wa.me/543755641575?text=Hola!%20Me%20gustar%C3%ADa%20consultar%20por%20el/la%20${encodeURIComponent(prod.nombre)}" target="_blank" class="w-full bg-cobre hover:bg-cobreOscuro text-white font-bold py-3 rounded transition uppercase tracking-widest text-sm flex justify-center items-center gap-2 mt-auto">
              Consultar <i class="fa-brands fa-whatsapp text-lg"></i>
            </a>
          </div>
        </div>
      `;
    }

    window.cerrarModal = function() {
      const modal = document.getElementById("modal-producto");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    cargarDatos();
  </script>
</body>
</html>
