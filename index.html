<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandalas - Cosas Ricas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fondoOscuro: '#161412', fondoMedio: '#4a4138', fondoTarjeta: '#221f1d',
            cobre: '#b87352', cobreOscuro: '#945a3f', textoClaro: '#f4ece2', textoGris: '#a89f94'
          },
          fontFamily: {
            titulo: ['"Playfair Display"', 'serif'],
            texto: ['"Montserrat"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .menu-activo { color: #b87352 !important; border-bottom: 2px solid #b87352; padding-bottom: 2px; }
    
    @keyframes pulsoSuave {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    .animacion-latido { animation: pulsoSuave 2s infinite ease-in-out; }
  </style>
</head>

<body class="bg-fondoMedio text-textoClaro font-texto min-h-screen flex flex-col antialiased">

  <!-- PANTALLA DE CARGA (SPLASH SCREEN) -->
  <div id="splash-screen" class="fixed inset-0 bg-fondoOscuro z-[9999] flex flex-col items-center justify-center transition-opacity duration-500">
    <img src="logo_mandalas_cobre.png" alt="Mandalas Cosas Ricas" class="w-48 md:w-64 animacion-latido mb-4 drop-shadow-2xl">
  </div>

  <!-- NAVEGACIÓN -->
  <nav class="bg-fondoOscuro py-4 px-6 md:px-12 flex flex-wrap justify-between items-center border-b border-gray-800 shadow-xl sticky top-0 z-40">
    <div class="font-titulo text-2xl font-bold text-cobre tracking-wide flex items-center gap-2">
      <img src="logo_mandalas_cobre.png" class="w-8 h-8 opacity-80" alt="Icono">
      Mandalas <span class="text-textoClaro italic font-normal text-lg">Cosas Ricas</span>
    </div>
    <div class="flex gap-4 mt-2 md:mt-0">
      <a href="https://www.instagram.com/mandalascosasricas?stkn=MTFrcXpzMGZxNXlzcg==" target="_blank" class="text-textoGris hover:text-cobre transition text-xl" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://wa.me/543755641575" target="_blank" class="text-textoGris hover:text-green-500 transition text-xl" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
    </div>
  </nav>

  <!-- MAIN / CATÁLOGO -->
  <main class="py-10 px-6 md:px-12 max-w-7xl mx-auto w-full flex-grow">
    
    <!-- Filtros de Categorías -->
    <div id="menu-categorias" class="flex flex-wrap justify-center gap-4 md:gap-8 mb-6"></div>
    
    <!-- Buscador en tiempo real -->
    <div class="flex justify-center mb-10">
      <div class="relative w-full max-w-md">
        <input type="text" id="buscador" oninput="buscarEnTiempoReal()" placeholder="Buscar tortas, postres, ingredientes..." class="w-full bg-fondoOscuro border border-gray-700 text-textoClaro px-5 py-3 rounded-full focus:border-cobre outline-none transition pl-12 shadow-lg">
        <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 transform -translate-y-1/2 text-textoGris"></i>
      </div>
    </div>

    <h2 id="titulo-categoria" class="font-titulo text-3xl text-textoClaro capitalize mb-8 text-center border-b border-gray-700 pb-2 inline-block mx-auto">Todo</h2>
    
    <div id="grilla-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
  </main>

  <footer class="bg-fondoOscuro py-6 text-center border-t border-gray-800 mt-auto">
    <p class="text-textoGris text-xs uppercase tracking-widest font-semibold mb-1">Mandalas Cosas Ricas &copy; 2026</p>
    <p class="text-[10px] text-gray-600">San Vicente, Misiones</p>
  </footer>

  <!-- Modal Anuncio Cliente (Flotante) -->
  <div id="modal-anuncio-flotante" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-[60] transition-opacity opacity-0 backdrop-blur-sm">
    <div class="bg-fondoTarjeta rounded-md max-w-lg w-full overflow-hidden border border-cobre/50 shadow-2xl relative">
      <button onclick="cerrarAnuncioFlotante()" class="absolute top-3 right-3 z-20 bg-black/60 hover:bg-cobre text-white w-8 h-8 rounded-full flex items-center justify-center transition border border-gray-600" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
      
      <div id="anuncio-bg" class="w-full min-h-[180px] relative p-8 flex flex-col items-center justify-center text-center bg-fondoOscuro">
         <div class="absolute inset-0 bg-gradient-to-b from-black/80 to-fondoTarjeta z-0"></div> 
         <div class="relative z-10">
            <i class="fa-solid fa-bullhorn text-3xl text-cobre mb-3"></i>
            <h3 id="anuncio-flotante-titulo" class="font-titulo text-2xl md:text-3xl text-cobre mb-2 drop-shadow-lg"></h3>
            <p id="anuncio-flotante-texto" class="text-textoClaro text-sm md:text-base leading-relaxed whitespace-pre-wrap max-w-md mx-auto"></p>
         </div>
      </div>
      <div class="p-5 bg-fondoTarjeta text-center border-t border-gray-800">
          <button onclick="cerrarAnuncioFlotante()" class="bg-cobre hover:bg-cobreOscuro text-white text-xs font-bold py-3 px-8 rounded uppercase tracking-widest transition shadow-lg">¡Entendido!</button>
      </div>
    </div>
  </div>

  <!-- Modal Detalle de Producto -->
  <div id="modal-producto" class="fixed inset-0 bg-black/95 hidden items-center justify-center p-4 z-50 transition-opacity opacity-0 backdrop-blur-sm">
    <div class="bg-fondoTarjeta rounded-md max-w-4xl w-full overflow-hidden border border-gray-700 shadow-2xl relative max-h-[90vh] flex flex-col">
      <button onclick="cerrarModalProducto()" class="absolute top-4 right-4 z-20 bg-black/50 hover:bg-cobre text-white w-8 h-8 rounded-full flex items-center justify-center transition border border-gray-600" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
      
      <div class="w-full overflow-y-auto flex flex-col md:flex-row">
        <!-- Lado Izquierdo: Galería -->
        <div class="md:w-1/2 bg-fondoOscuro relative flex flex-col">
          <div class="w-full aspect-[3/4] relative">
            <img id="modal-img-principal" src="" alt="Producto" class="w-full h-full object-cover transition-opacity duration-300">
          </div>
          <div id="modal-miniaturas" class="flex gap-2 p-3 overflow-x-auto bg-[#0a0908] border-t border-gray-800"></div>
        </div>
        
        <!-- Lado Derecho: Info -->
        <div class="md:w-1/2 p-6 md:p-10 flex flex-col justify-center bg-fondoTarjeta">
          <p id="modal-categoria" class="text-cobre text-[10px] uppercase font-bold tracking-widest mb-2"></p>
          <h3 id="modal-nombre" class="font-titulo text-3xl md:text-4xl text-textoClaro mb-4 leading-tight"></h3>
          <p id="modal-descripcion" class="text-textoGris text-sm leading-relaxed mb-8 whitespace-pre-wrap"></p>
          
          <a id="btn-pedir-whatsapp" href="#" target="_blank" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded shadow-lg transition uppercase tracking-widest text-sm flex items-center justify-center gap-2 mt-auto flex-shrink-0">
            <i class="fa-brands fa-whatsapp text-lg"></i> Consultar Disponibilidad
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBw3U23D7b8nPhZa4z5sSNkqHPx1jVdIIg",
      authDomain: "mandalas-bd.firebaseapp.com",
      projectId: "mandalas-bd",
      storageBucket: "mandalas-bd.firebasestorage.app",
      messagingSenderId: "401668436120",
      appId: "1:401668436120:web:16b4cec5606b6e846ee0ed"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productos = [];
    let categorias = [];
    // ACÁ ESTÁ CORREGIDO EL NÚMERO DEFINITIVO PARA LOS PEDIDOS
    let telefonoWhatsapp = "543755641575"; 
    let hayAnuncioParaMostrar = false;
    let categoriaActual = 'todos'; 

    sumarVisita();
    inicializarCatalogo();

    async function sumarVisita() {
      try {
        const refVisitas = doc(db, "estadisticas", "visitas");
        await updateDoc(refVisitas, { total: increment(1) });
      } catch (e) { console.log("Visita no contada"); }
    }

    async function inicializarCatalogo() {
      try {
        const [anuncioSnap, categoriasSnap, productosSnap] = await Promise.all([
          getDoc(doc(db, "configuracion", "anuncio")),
          getDocs(collection(db, "categorias")),
          getDocs(collection(db, "productos"))
        ]);

        if (anuncioSnap.exists()) {
          const anuncio = anuncioSnap.data();
          if (anuncio.activo) {
            hayAnuncioParaMostrar = true;
            prepararAnuncioFlotante(anuncio);
          }
        }

        categoriasSnap.forEach(doc => {
          if (!doc.data().oculta) categorias.push({ id: doc.id, ...doc.data() });
        });
        categorias.sort((a, b) => a.nombre.localeCompare(b.nombre));

        productosSnap.forEach(doc => {
          productos.push({ id: doc.id, ...doc.data() });
        });

        renderizarFiltros();
        filtrarProductos('todos');

      } catch (error) {
        console.error("Error al cargar base de datos:", error);
      } finally {
        quitarSplashScreen(hayAnuncioParaMostrar);
      }
    }

    function quitarSplashScreen(mostrarAnuncio) {
      const splash = document.getElementById('splash-screen');
      splash.classList.add('opacity-0');
      setTimeout(() => {
        splash.style.display = 'none';
        
        if(mostrarAnuncio) {
            const img = new Image();
            img.src = 'fondo_anuncio.jpg';
            img.onload = () => setTimeout(() => mostrarAnuncioFlotante(), 100);
            img.onerror = () => setTimeout(() => mostrarAnuncioFlotante(), 100);
        }
      }, 500); 
    }

    function prepararAnuncioFlotante(anuncio) {
      document.getElementById('anuncio-flotante-titulo').innerText = anuncio.titulo;
      document.getElementById('anuncio-flotante-texto').innerText = anuncio.texto;
      
      const fondo = document.getElementById('anuncio-bg');
      fondo.style.backgroundImage = `url('fondo_anuncio.jpg')`;
      fondo.style.backgroundSize = 'cover';
      fondo.style.backgroundPosition = 'center';
    }

    function mostrarAnuncioFlotante() {
      const modal = document.getElementById('modal-anuncio-flotante');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => { modal.classList.remove('opacity-0'); }, 10);
      document.body.style.overflow = 'hidden'; 
    }

    window.cerrarAnuncioFlotante = function() {
      const modal = document.getElementById('modal-anuncio-flotante');
      modal.classList.add('opacity-0');
      setTimeout(() => { 
        modal.classList.add('hidden'); 
        modal.classList.remove('flex');
        document.body.style.overflow = 'auto'; 
      }, 300);
    }

    function renderizarFiltros() {
      const menu = document.getElementById("menu-categorias");
      menu.innerHTML = `<button onclick="filtrarProductos('todos')" class="menu-btn menu-activo text-textoClaro hover:text-cobre transition text-xs font-semibold tracking-widest uppercase">Todo</button>`;
      
      categorias.forEach(cat => {
        menu.innerHTML += `<button onclick="filtrarProductos('${cat.nombre}')" class="menu-btn text-textoClaro hover:text-cobre transition text-xs font-semibold tracking-widest uppercase">${cat.nombre}</button>`;
      });
    }

    window.filtrarProductos = function(cat) {
      categoriaActual = cat; 
      
      const botones = document.querySelectorAll(".menu-btn");
      botones.forEach(btn => {
        btn.classList.remove("menu-activo");
        const textoBoton = btn.innerText.replace(" ", "").toLowerCase();
        if (cat === "todos" && textoBoton.includes("todo")) btn.classList.add("menu-activo");
        else if (textoBoton.includes(cat.replace(" ", "").toLowerCase())) btn.classList.add("menu-activo");
      });

      document.getElementById("titulo-categoria").innerText = cat === "todos" ? "Catálogo Completo" : cat;
      document.getElementById("buscador").value = ""; 

      aplicarFiltrosYRenderizar();
    }

    window.buscarEnTiempoReal = function() {
      const termino = document.getElementById('buscador').value.trim();
      
      if (termino !== "") {
          document.getElementById("titulo-categoria").innerText = "Resultados de Búsqueda";
      } else {
          document.getElementById("titulo-categoria").innerText = categoriaActual === "todos" ? "Catálogo Completo" : categoriaActual;
      }
      
      aplicarFiltrosYRenderizar();
    }

    function aplicarFiltrosYRenderizar() {
      const terminoBusqueda = document.getElementById('buscador').value.toLowerCase().trim();
      
      let filtrados = categoriaActual === "todos" 
        ? productos 
        : productos.filter(p => p.categoria.toLowerCase() === categoriaActual.toLowerCase());

      if (terminoBusqueda !== "") {
        filtrados = filtrados.filter(p => 
          p.nombre.toLowerCase().includes(terminoBusqueda) || 
          p.descripcion.toLowerCase().includes(terminoBusqueda)
        );
      }

      const grilla = document.getElementById("grilla-productos");
      grilla.innerHTML = "";

      if(filtrados.length === 0) {
        grilla.innerHTML = `
          <div class="col-span-full text-center py-12 text-textoGris">
            <i class="fa-solid fa-search text-4xl mb-4 opacity-30"></i>
            <p class="text-lg">No encontramos ninguna delicia con esa búsqueda.</p>
          </div>`;
        return;
      }

      filtrados.forEach(prod => {
        const tieneGaleria = (prod.galeria && prod.galeria.length > 0) ? `<div class="absolute top-3 right-3 bg-black/80 text-white text-[10px] px-2 py-1 rounded shadow border border-gray-700"><i class="fa-solid fa-images"></i> +${prod.galeria.length}</div>` : '';
        
        grilla.innerHTML += `
          <div onclick="abrirModalProducto('${prod.id}')" class="bg-fondoTarjeta rounded-md border border-gray-800 flex flex-col shadow-lg cursor-pointer group hover:border-cobre transition duration-300">
            <div class="w-full aspect-[3/4] overflow-hidden bg-fondoOscuro rounded-t-md relative">
              <img src="${prod.imagen}" alt="${prod.nombre}" loading="lazy" class="w-full h-full object-cover opacity-90 group-hover:scale-105 group-hover:opacity-100 transition duration-500" onerror="this.style.display='none'">
              ${tieneGaleria}
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-end justify-center pb-6">
                 <span class="bg-cobre text-white text-xs font-bold px-4 py-2 rounded-full shadow uppercase tracking-wider">Ver Detalles</span>
              </div>
            </div>
            <div class="p-5 flex flex-col flex-grow">
              <p class="text-cobre text-[10px] uppercase font-bold tracking-widest mb-1">${prod.categoria}</p>
              <h3 class="font-titulo text-lg text-textoClaro mb-2 leading-tight">${prod.nombre}</h3>
            </div>
          </div>
        `;
      });
    }

    window.abrirModalProducto = function(id) {
      const prod = productos.find(p => p.id === id);
      
      const imgPrincipal = document.getElementById('modal-img-principal');
      imgPrincipal.classList.remove('opacity-0'); 
      imgPrincipal.src = prod.imagen || '';
      imgPrincipal.style.display = prod.imagen ? 'block' : 'none';
      
      document.getElementById('modal-categoria').innerText = prod.categoria;
      document.getElementById('modal-nombre').innerText = prod.nombre;
      document.getElementById('modal-descripcion').innerText = prod.descripcion;
      
      const msj = encodeURIComponent(`¡Hola Mandalas! Quisiera consultar la disponibilidad de: *${prod.nombre}*.`);
      document.getElementById('btn-pedir-whatsapp').href = `https://wa.me/${telefonoWhatsapp}?text=${msj}`;

      const contenedorMiniaturas = document.getElementById('modal-miniaturas');
      contenedorMiniaturas.innerHTML = "";
      
      let todasLasFotos = [];
      if(prod.imagen) todasLasFotos.push(prod.imagen);
      if(prod.galeria) todasLasFotos = [...todasLasFotos, ...prod.galeria];

      if (todasLasFotos.length > 1) {
        todasLasFotos.forEach(url => {
          contenedorMiniaturas.innerHTML += `
            <img src="${url}" alt="Miniatura" loading="lazy" onclick="cambiarFotoPrincipal('${url}')" class="w-16 h-16 object-cover rounded cursor-pointer border border-transparent hover:border-cobre transition opacity-70 hover:opacity-100 flex-shrink-0" onerror="this.style.display='none'">
          `;
        });
      }

      const modal = document.getElementById('modal-producto');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      
      modal.querySelector('.overflow-y-auto').scrollTop = 0;

      setTimeout(() => { modal.classList.remove('opacity-0'); }, 10);
      document.body.style.overflow = 'hidden'; 
    }

    window.cambiarFotoPrincipal = function(url) {
      const imgPrincipal = document.getElementById('modal-img-principal');
      
      if (imgPrincipal.src === url) return;

      imgPrincipal.classList.add('opacity-0');
      
      setTimeout(() => {
        imgPrincipal.src = url;
        
        imgPrincipal.onload = () => {
          imgPrincipal.classList.remove('opacity-0');
        };
        
        imgPrincipal.onerror = () => {
          imgPrincipal.classList.remove('opacity-0');
        }
      }, 300);
    }

    window.cerrarModalProducto = function() {
      const modal = document.getElementById('modal-producto');
      modal.classList.add('opacity-0');
      setTimeout(() => { 
        modal.classList.add('hidden'); 
        modal.classList.remove('flex');
        document.body.style.overflow = 'auto';
      }, 300);
    }
  </script>
</body>
</html>
